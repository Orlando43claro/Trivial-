<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ascenso Mental</title>
    
    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-XXXXXXXXXX');
    </script>
    
    <style>
:root {
    --primary-color: #6a11cb;
    --secondary-color: #2575fc;
    --accent-color: #ff4081;
    --match-color: #4caf50;
    --wildcard-color: #ff9800;
    --control-color: #ffeb3b;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: 'arial', sans-serif;
}

body {
    background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
    color: white;
    position: relative;
}

.container {
    max-width: 900px;
    width: 100%;
    text-align: center;
}

h2 {
    font-size: 2.5rem;
    margin-bottom: 10px;
    text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
}

.stats {
    display: flex;
    justify-content: space-around;
    background-color: rgba(255, 255, 255, 0.2);
    border-radius: 10px;
    padding: 10px;
    margin: 20px 0;
    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
}

.stat-box {
    display: flex;
    flex-direction: column;
}

.stat-label {
    font-size: 1.5rem;
    margin-bottom: 3px;
    line-height: 1;
}

.stat-value {
    font-size: 1.4rem;
    font-weight: bold;
    transition: transform 0.2s;
}

/* Animación de Puntos */
.score-boost {
    animation: score-jump 0.4s ease-out;
}

@keyframes score-jump {
    0% { transform: scale(1); }
    50% { transform: scale(1.3) translateY(-5px); }
    100% { transform: scale(1); }
}

/* Progress Bar */
.progress-bar-container {
    width: 90%;
    max-width: 600px; 
    margin: 15px auto 25px auto;
    background-color: #333;
    border-radius: 15px;
    height: 25px;
    overflow: hidden;
    box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.5); 
}

.progress-bar {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--accent-color), var(--control-color)); 
    transition: width 0.5s ease-out;
    border-radius: 15px;
}

.game-board {
    display: grid;
    gap: 10px;
    margin: 20px auto;
    max-width: 900px;
    padding: 10px;
    background-color: rgba(255, 255, 255, 0.1);
    border-radius: 10px;
    box-shadow: 0 0 10px rgba(0, 0, 0, 0.5), 
                0 0 20px var(--primary-color), 
                0 0 30px var(--secondary-color);
    animation: led-border 4s infinite alternate; 
}

@keyframes led-border {
    0% { box-shadow: 0 0 10px rgba(0, 0, 0, 0.5), 0 0 20px var(--primary-color), 0 0 30px var(--secondary-color); }
    50% { box-shadow: 0 0 10px rgba(0, 0, 0, 0.5), 0 0 20px var(--accent-color), 0 0 30px var(--wildcard-color); }
    100% { box-shadow: 0 0 10px rgba(0, 0, 0, 0.5), 0 0 20px var(--secondary-color), 0 0 30px var(--primary-color); }
}

/* Cards */
.card {
    height: 80px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.5rem;
    cursor: pointer;
    transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
    color: white;
    font-weight: bold;
    backface-visibility: hidden;
    transform-style: preserve-3d;
    position: relative;
    border: 3px solid rgba(255, 255, 255, 0.5); 
}

.card.matched {
    box-shadow: 0 0 15px var(--control-color), 0 4px 8px rgba(0, 0, 0, 0.3);
}

.card-inner {
    position: absolute;
    width: 100%;
    height: 100%;
    text-align: center;
    transition: transform 0.6s;
    transform-style: preserve-3d;
}

.card-inner.flipped {
    transform: rotateY(180deg);
}

.card-front, .card-back {
    position: absolute;
    width: 100%;
    height: 100%;
    backface-visibility: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 8px;
}

.card-front {
    background-color: #1a237e;
    color: white;
    font-size: 1.5rem;
}

.card-back {
    background-color: white;
    color: #1a237e;
    font-size: 1.5rem;
    transform: rotateY(180deg);
}

.card.matched .card-back {
    background-color: var(--match-color);
    color: white;
    cursor: default;
}

/* Controls */
.controls {
    margin-top: 15px;
    display: flex;
    justify-content: center; 
    gap: 15px; 
}

.controls button {
    color: #1a237e;
    border: none;
    padding: 12px 25px;
    font-size: 1rem;
    border-radius: 50px;
    cursor: pointer;
    transition: all 0.3s;
    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
    font-weight: bold;
    background-color: var(--control-color);
}

.controls button#wildcard-btn {
    min-width: 160px;
}

.controls button#wildcard-btn.active {
    background-color: var(--wildcard-color);
    box-shadow: 0 0 15px var(--wildcard-color);
    color: white;
}

.controls button#reset-btn {
    background-color: #f44336;
    color: white;
}

.controls button:hover:not(:disabled) {
    background-color: #ffc107;
    transform: translateY(-2px);
}

.controls button#reset-btn:hover:not(:disabled) {
    background-color: #d32f2f;
}

.controls button:disabled {
    background-color: #9c27b0; 
    cursor: not-allowed;
    opacity: 0.7;
    color: white;
}

/* Audio Control */
.audio-control {
    position: fixed;
    top: 20px;
    right: 20px;
    z-index: 200;
}

.audio-control button {
    background-color: rgba(0, 0, 0, 0.3); 
    color: white;
    border: none;
    border-radius: 50%;
    width: 45px;
    height: 45px;
    font-size: 1.5rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
    transition: background-color 0.2s;
}

.audio-control button:hover {
    background-color: rgba(0, 0, 0, 0.5);
}

/* Level Up */
.brain-icon {
    font-size: 6rem;
    animation: brain-float 1.5s infinite alternate ease-in-out, 
               brain-scale 0.5s ease-out;
    color: var(--control-color);
    text-shadow: 0 0 15px rgba(255, 235, 59, 0.8);
}

@keyframes brain-float {
    from { transform: translateY(0); }
    to { transform: translateY(-15px); }
}

@keyframes brain-scale {
    0% { transform: scale(0); }
    100% { transform: scale(1); }
}

.level-up {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0, 0, 0, 0.9);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 100;
    text-align: center;
}

.level-up h2 {
    font-size: 3rem;
    margin-bottom: 10px;
    color: var(--control-color);
    text-shadow: 2px 2px 5px rgba(0,0,0,0.5);
}

/* Feedback Message */
#feedback-message {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 300;
    padding: 20px 40px;
    border-radius: 10px;
    font-size: 2rem;
    font-weight: bold;
    color: white;
    opacity: 0;
    transition: opacity 0.3s, transform 0.3s;
    pointer-events: none;
    text-shadow: 2px 2px 5px rgba(0,0,0,0.5);
}

/* Responsive */
@media (max-width: 480px) {
    .card {
        height: 60px;
        font-size: 1rem;
    }
    .stats {
        padding: 8px;
        flex-wrap: wrap;
    }
    .stat-label {
        font-size: 1.2rem;
    }
    .stat-value {
        font-size: 1.2rem;
    }
    .audio-control button {
        width: 40px;
        height: 40px;
        font-size: 1.3rem;
    }
    .controls {
        flex-direction: row;
        flex-wrap: wrap; 
        gap: 10px;
    }
    .controls button {
        flex-grow: 1; 
        min-width: unset; 
    }
}
</style>
</head>
<body>
    <!-- Feedback Message -->
    <div id="feedback-message"></div>

    <!-- Audio Elements -->
    <audio id="audioFondo" src="fondo.mp3" loop></audio> 
    <audio id="audioClick" src="primero.mp3"></audio> 
    <audio id="audioLevelUp" src="nivel.mp3"></audio> 
    
    <!-- Audio Control -->
    <div class="audio-control">
        <button id="toggle-music-btn">🔊</button>
    </div>

    <div class="container">
        <h2>Ascenso Mental</h2>
        
        <!-- STATS CON TIMER -->
        <div class="stats">
            <div class="stat-box">
                <div class="stat-label">🧠</div> <div class="stat-value" id="level">1</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">✨</div> <div class="stat-value" id="score">0</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">🎯</div> <div class="stat-value" id="attempts">0</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">⭐</div> <div class="stat-value" id="wildcards">0</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">⏱️</div> <div class="stat-value" id="time">00:00</div>
            </div>
        </div>
        
        <!-- Progress Bar -->
        <div class="progress-bar-container">
            <div id="level-progress" class="progress-bar"></div>
        </div>
        
        <!-- Game Board -->
        <div class="game-board" id="game-board"></div>

        <!-- Controls -->
        <div class="controls">
            <button id="wildcard-btn">⭐ Usar Comodín</button> 
            <button onclick="window.location.href='canje.html'">🏆 Canjear Premios</button>
            <button id="reset-btn">🔄 Nuevo Juego</button>
        </div>
    </div>

    <script>
// ====================================================================
// === VARIABLES GLOBALES ===
// ====================================================================
const gameBoard = document.getElementById('game-board');
const levelDisplay = document.getElementById('level');
const scoreDisplay = document.getElementById('score');
const scoreValueElement = document.getElementById('score').closest('.stat-value');
const attemptsDisplay = document.getElementById('attempts');
const wildcardDisplay = document.getElementById('wildcards'); 
const wildcardBtn = document.getElementById('wildcard-btn'); 
const resetBtn = document.getElementById('reset-btn');
const feedbackMessage = document.getElementById('feedback-message'); 
const progressBar = document.getElementById('level-progress');
const timeDisplay = document.getElementById('time');

// AUDIO
const audioFondo = document.getElementById('audioFondo');
const audioClick = document.getElementById('audioClick');
const audioLevelUp = document.getElementById('audioLevelUp');
const toggleMusicBtn = document.getElementById('toggle-music-btn');
let isMusicPlaying = false; 

const MAX_PAIRS = 28; 
let level = 1, score = 0, attempts = 0, wildcards = 0;
let flippedCards = [], matchedPairs = 0, totalPairsInLevel = 5;
let canFlip = true, wildcardActive = false, matchedCardIndices = []; 
let timeStart, timerInterval;

const allSymbols = [
    '🦊', '🐱', '🐺', '🦄', '🐰', '🐶', '🐻', '🐼', '🐨', '🐯', 
    '🦁', '🐮', '🐷', '🐸', '🐵', '🐔', '🐧', '🦅', '🦉', '🦆', 
    '🦋', '🐛', '🐝', '🐞', '🐠', '🐳', '🐬', '🐢', '🐍', '🐊', 
    '🇦🇷', '🇧🇷', '🇨🇱', '🇨🇴', '🇪🇸', '🇫🇷', '🇬🇧', '🇮🇹', '🇯🇵', '🇲🇽', 
    '🇺🇸', '🇨🇦', '🇩🇪', '🇨🇳', '🇮🇳', '🇵🇪', '🇵🇹', '🇷🇺', '🇰🇷', '🇿🇦', 
    '🚗', '🚕', '🚌', '🏎️', '🚓', '🚑', '🚒', '🚚', '🚜', '🛵', 
    '🚲', '🚢', '✈️', '🚀', '🚁', '🚂', '🚄', '🚆', '🚇', '🚃'
];

// ====================================================================
// === AUDIO Y EFECTOS ===
// ====================================================================
function playSoundClick() {
    audioClick.pause(); audioClick.currentTime = 0; audioClick.play().catch(() => {});
}

function playSoundLevelUp() {
    audioLevelUp.pause(); audioLevelUp.currentTime = 0; audioLevelUp.volume = 0.8; 
    audioLevelUp.play().catch(() => {});
}

function toggleBackgroundMusic() {
    if (isMusicPlaying) {
        audioFondo.pause(); toggleMusicBtn.textContent = '🔈'; 
    } else {
        audioFondo.volume = 0.4; audioFondo.play().catch(() => {});
        toggleMusicBtn.textContent = '🔊'; 
    }
    isMusicPlaying = !isMusicPlaying; 
    localStorage.setItem('memoryGameMusicState', isMusicPlaying); 
}

function animateScoreGain() {
    scoreValueElement.classList.add('score-boost');
    setTimeout(() => scoreValueElement.classList.remove('score-boost'), 400); 
}

function showFeedback(message, type) {
    feedbackMessage.textContent = message;
    feedbackMessage.style.backgroundColor = type === 'match' ? 
        'rgba(76, 175, 80, 0.8)' : 'rgba(244, 67, 54, 0.8)';
    
    feedbackMessage.style.opacity = '1';
    feedbackMessage.style.transform = 'translate(-50%, -50%) scale(1.1)';
    setTimeout(() => {
        feedbackMessage.style.opacity = '0';
        feedbackMessage.style.transform = 'translate(-50%, -50%) scale(1)';
    }, 1000); 
}

// ====================================================================
// === TIMER ===
// ====================================================================
function startTimer() {
    timeStart = Date.now();
    timerInterval = setInterval(updateTimer, 1000);
}

function updateTimer() {
    const elapsed = Math.floor((Date.now() - timeStart) / 1000);
    const minutes = Math.floor(elapsed / 60).toString().padStart(2, '0');
    const seconds = (elapsed % 60).toString().padStart(2, '0');
    timeDisplay.textContent = `${minutes}:${seconds}`;
}

function stopTimer() {
    clearInterval(timerInterval);
}

// ====================================================================
// === STORAGE ===
// ====================================================================
function loadGameData() {
    level = parseInt(localStorage.getItem('memoryGameLevel')) || 1;
    score = parseInt(localStorage.getItem('memoryGameScore')) || 0;
    attempts = parseInt(localStorage.getItem('memoryGameAttempts')) || 0;
    wildcards = parseInt(localStorage.getItem('memoryGameWildcards')) || 0;
    matchedCardIndices = JSON.parse(localStorage.getItem('memoryMatchedIndices')) || [];
    isMusicPlaying = localStorage.getItem('memoryGameMusicState') === 'true';
    
    updateStatsDisplays();
    toggleMusicBtn.textContent = isMusicPlaying ? '🔊' : '🔈';
}

function saveGameData() {
    localStorage.setItem('memoryGameLevel', level);
    localStorage.setItem('memoryGameScore', score);
    localStorage.setItem('memoryMatchedIndices', JSON.stringify(matchedCardIndices));
    localStorage.setItem('memoryGameMusicState', isMusicPlaying); 
    localStorage.setItem('memoryGameAttempts', attempts); 
    localStorage.setItem('memoryGameWildcards', wildcards); 
}

// ====================================================================
// === DISPLAYS ===
// ====================================================================
function updateStatsDisplays() {
    levelDisplay.textContent = level;
    scoreDisplay.textContent = score;
    attemptsDisplay.textContent = attempts;
    wildcardDisplay.textContent = wildcards;
    
    // Progress Bar Animada
    if (progressBar && totalPairsInLevel > 0) {
        const percentage = (matchedPairs / totalPairsInLevel) * 100;
        progressBar.style.width = '0%';
        setTimeout(() => progressBar.style.width = `${percentage}%`, 10);
    }
    
    updateComodinButtonAppearance();
}

function updateComodinButtonAppearance() {
    wildcardBtn.classList.remove('active');
    
    if (wildcardActive) {
        wildcardBtn.disabled = true;
        wildcardBtn.classList.add('active');
        wildcardBtn.textContent = '⏳ Comodín Activo'; 
    } else if (wildcards > 0) {
        wildcardBtn.disabled = false;
        wildcardBtn.textContent = '🧡 Usar Comodín';
    } else {
        wildcardBtn.disabled = true;
        wildcardBtn.textContent = '🚫 Sin Comodines'; 
    }
}

// ====================================================================
// === JUEGO PRINCIPAL ===
// ====================================================================
function updateScore(points) {
    score += points; animateScoreGain(); saveGameData();
}

function clearGameBoardCards() {
    gameBoard.querySelectorAll('.card').forEach(card => card.remove());
}

function initGame() {
    clearGameBoardCards(); flippedCards = [];
    const pairsCount = Math.min(5 + (level - 1), MAX_PAIRS); 
    totalPairsInLevel = pairsCount; matchedPairs = matchedCardIndices.length / 2;
    const totalCards = pairsCount * 2; updateStatsDisplays(); startTimer();

    if (matchedPairs === pairsCount) { levelUp(false); return; }

    let currentLayout = JSON.parse(localStorage.getItem('memoryCardLayout'));
    
    if (currentLayout === null || currentLayout.length !== totalCards) {
        attempts = 0; 
        const levelSymbols = pairsCount === MAX_PAIRS ? 
            shuffleArray([...allSymbols]).slice(0, MAX_PAIRS) : 
            allSymbols.slice(0, pairsCount);
        
        const cardValues = [...levelSymbols, ...levelSymbols];
        currentLayout = shuffleArray(cardValues);
        localStorage.setItem('memoryCardLayout', JSON.stringify(currentLayout));
        matchedCardIndices = []; saveGameData();
        
        if (matchedPairs === 0) {
            canFlip = false; renderCards(currentLayout, totalCards, true); return;
        }
    }

    attemptsDisplay.textContent = attempts;
    renderCards(currentLayout, totalCards, false);
}

function renderCards(layout, totalCards, quickLook) {
    const columns = Math.min(Math.ceil(Math.sqrt(totalCards)), 8);
    gameBoard.style.gridTemplateColumns = `repeat(${columns}, 1fr)`;

    layout.forEach((symbol, index) => {
        const card = document.createElement('div');
        card.classList.add('card');
        card.dataset.symbol = symbol;
        card.dataset.index = index; 
        
        const isMatched = matchedCardIndices.includes(index);
        const isFlipped = isMatched || quickLook;

        card.innerHTML = `
            <div class="card-inner ${isFlipped ? 'flipped' : ''}">
                <div class="card-front">?</div>
                <div class="card-back">${symbol}</div>
            </div>
        `;
        
        if (isMatched) card.classList.add('matched');
        else if (!quickLook) card.addEventListener('click', () => flipCard(card));
        
        gameBoard.appendChild(card);
    });
    
    if (quickLook) {
        setTimeout(() => {
            gameBoard.querySelectorAll('.card').forEach(card => {
                card.querySelector('.card-inner').classList.remove('flipped');
                card.addEventListener('click', () => flipCard(card));
            });
            canFlip = true; updateComodinButtonAppearance();
        }, 1500);
    } else {
        canFlip = true; updateComodinButtonAppearance();
    }
}

function flipCard(card) {
    const cardInner = card.querySelector('.card-inner');
    if (!canFlip || cardInner.classList.contains('flipped') || card.classList.contains('matched')) return;
    
    playSoundClick(); cardInner.classList.add('flipped'); flippedCards.push(card);
    
    if (flippedCards.length === 2) {
        canFlip = false; attempts++; updateStatsDisplays(); saveGameData(); 

        const [cardA, cardB] = flippedCards;
        if (cardA.dataset.symbol === cardB.dataset.symbol) {
            setTimeout(() => {
                showFeedback("¡Pareja!", 'match'); 
                cardA.classList.add('matched'); cardB.classList.add('matched');
                matchedCardIndices.push(parseInt(cardA.dataset.index), parseInt(cardB.dataset.index));
                matchedPairs++; updateScore(1); 
                cardA.removeEventListener('click', flipCard); cardB.removeEventListener('click', flipCard);
                updateStatsDisplays(); 
                
                if (matchedPairs === totalPairsInLevel) setTimeout(levelUp, 800);
                flippedCards = []; canFlip = true;
            }, 500);
        } else {
            setTimeout(() => {
                showFeedback("¡No!", 'fail'); 
                cardA.querySelector('.card-inner').classList.remove('flipped');
                cardB.querySelector('.card-inner').classList.remove('flipped');
                flippedCards = []; canFlip = true; updateComodinButtonAppearance();
            }, 1000);
        }
    }
}

function useWildcard() {
    if (wildcards <= 0 || !canFlip || wildcardActive) return;

    canFlip = false; wildcardActive = true; wildcards--; 
    updateComodinButtonAppearance(); saveGameData();
    showFeedback("¡Comodín Activo! ✨", 'match');

    const allUnmatchedCards = Array.from(gameBoard.querySelectorAll('.card:not(.matched)'));
    if (allUnmatchedCards.length < 2) { canFlip = true; wildcardActive = false; return; }

    let card1 = null, card2 = null;
    for(let i = 0; i < allUnmatchedCards.length; i++){
        const currentSymbol = allUnmatchedCards[i].dataset.symbol;
        card2 = allUnmatchedCards.slice(i + 1).find(c => c.dataset.symbol === currentSymbol);
        if(card2){ card1 = allUnmatchedCards[i]; break; }
    }
    
    if (!card1 || !card2) { canFlip = true; wildcardActive = false; return; }

    card1.querySelector('.card-inner').classList.add('flipped');
    card2.querySelector('.card-inner').classList.add('flipped');

    setTimeout(() => {
        card1.classList.add('matched'); card2.classList.add('matched');
        card1.removeEventListener('click', flipCard); card2.removeEventListener('click', flipCard);
        matchedCardIndices.push(parseInt(card1.dataset.index), parseInt(card2.dataset.index));
        matchedPairs++; updateScore(2); wildcardActive = false; canFlip = true;

        if (matchedPairs === totalPairsInLevel) setTimeout(levelUp, 800);
        else updateStatsDisplays();
    }, 1200);
}

function resetGame() {
    if (!confirm('¿Reiniciar todo el juego?\nPerderás progreso, puntuación y comodines.')) return;
    level = 1; score = 0; attempts = 0; wildcards = 0;
    matchedCardIndices = []; flippedCards = []; localStorage.clear();
    saveGameData(); initGame(); showFeedback('¡Juego Reiniciado!', 'match');
}

function levelUp(showScreen = true) {
    playSoundLevelUp(); stopTimer();
    
    if (typeof gtag === 'function') {
        gtag('event', 'level_up', {
            'level': level, 'score_at_level_end': score, 'attempts_to_complete': attempts,
            'event_category': 'game_progression'
        });
    }

    canFlip = false; const oldLevel = level; level++; wildcards++; 
    matchedCardIndices = []; localStorage.removeItem('memoryCardLayout'); saveGameData(); 

    if (!showScreen) { canFlip = true; initGame(); return; }
    
    const levelUpScreen = document.createElement('div');
    levelUpScreen.classList.add('level-up');
    const nextPairsCount = Math.min(5 + (level - 1), MAX_PAIRS);
    const levelMessage = nextPairsCount === MAX_PAIRS ? 
        `¡Máxima Dificultad! (${MAX_PAIRS * 2} cartas)` : 
        `Preparando Nivel ${level} (${nextPairsCount} pares)...`;
    
    levelUpScreen.innerHTML = `
        <span class="brain-icon" style="margin-bottom: 20px;">🧠</span>
        <h2>¡Nivel ${oldLevel} Completado!</h2>
        <p>Puntuación actual: <strong>${score}</strong></p>
        <p>¡Has ganado 1 Comodín! Tienes <strong>${wildcards}</strong>.</p>
        <p style="font-size: 1.8rem; font-weight: bold; color: var(--control-color); margin-top: 20px;">
            ${levelMessage}
        </p>
    `;
    
    document.body.appendChild(levelUpScreen);
    setTimeout(() => {
        if(document.body.contains(levelUpScreen)) document.body.removeChild(levelUpScreen);
        initGame(); 
    }, 2500);
}

function shuffleArray(array) {
    const newArray = [...array];
    for (let i = newArray.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
    }
    return newArray;
}

// ====================================================================
// === INICIALIZACIÓN ===
// ====================================================================
toggleMusicBtn.addEventListener('click', toggleBackgroundMusic);
wildcardBtn.addEventListener('click', useWildcard);
resetBtn.addEventListener('click', resetGame);

window.addEventListener('load', () => {
    loadGameData(); initGame();
    if (isMusicPlaying) audioFondo.play().catch(() => {});
});

window.addEventListener('beforeunload', () => {
    if (isMusicPlaying) { audioFondo.pause(); audioFondo.currentTime = 0; }
    localStorage.setItem('memoryGameMusicState', isMusicPlaying);
});
</script>
