<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ascenso Mental</title>

    <style>
        /* Definición de la variable de color principal */
        :root {
            --primary-color: #6a11cb;
            --secondary-color: #2575fc;
            --accent-color: #ff4081; /* Usado para botones y progreso */
            --match-color: #4caf50;
            --wildcard-color: #ff9800;
            --control-color: #ffeb3b; /* NUEVO: Color unificado para botones de control */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'arial', sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            color: white;
            position: relative;
        }
        
        .container {
            max-width: 900px;
            width: 100%;
            text-align: center;
        }
        
        h2 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }
        
        .stats {
            display: flex;
            justify-content: space-around;
            background-color: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            padding: 10px;
            margin: 20px 0;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            position: relative;
        }
        
        .stat-box {
            display: flex;
            flex-direction: column;
        }
        
        .stat-label {
            font-size: 0.8rem;
            margin-bottom: 3px;
        }
        
        .stat-value {
            font-size: 1.4rem;
            font-weight: bold;
            transition: transform 0.2s;
        }
        
        /* === ESTILOS DE ANIMACIÓN DE PUNTOS === */
        .score-boost {
            animation: score-jump 0.4s ease-out;
        }
        
        @keyframes score-jump {
            0% { transform: scale(1); }
            50% { transform: scale(1.3) translateY(-5px); }
            100% { transform: scale(1); }
        }
        /* ==================================== */

        /* === INDICADOR DE PROGRESO DEL NIVEL === */
        .progress-bar-container {
            width: 90%;
            max-width: 600px; 
            margin: 15px auto 25px auto;
            background-color: #333;
            border-radius: 15px;
            height: 25px;
            overflow: hidden;
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.5); 
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--accent-color), var(--control-color)); 
            transition: width 0.5s ease-out;
            border-radius: 15px;
        }
        /* ==================================== */

        .game-board {
            display: grid;
            gap: 10px;
            margin: 20px auto;
            max-width: 900px;
            padding: 10px;
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            position: relative;
            /* NUEVO: Borde LED dinámico */
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5), 
                        0 0 20px var(--primary-color), 
                        0 0 30px var(--secondary-color);
            animation: led-border 4s infinite alternate; 
        }

        /* NUEVO: Animación del Borde LED */
        @keyframes led-border {
            0% { box-shadow: 0 0 10px rgba(0, 0, 0, 0.5), 0 0 20px var(--primary-color), 0 0 30px var(--secondary-color); }
            50% { box-shadow: 0 0 10px rgba(0, 0, 0, 0.5), 0 0 20px var(--accent-color), 0 0 30px var(--wildcard-color); }
            100% { box-shadow: 0 0 10px rgba(0, 0, 0, 0.5), 0 0 20px var(--secondary-color), 0 0 30px var(--primary-color); }
        }
        
        /* === PERSONALIZACIÓN DE LAS CARTAS (MEJORADO) === */
        .card {
            height: 80px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            cursor: pointer;
            transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            color: white;
            font-weight: bold;
            backface-visibility: hidden;
            transform-style: preserve-3d;
            position: relative;
            border: 3px solid rgba(255, 255, 255, 0.5); 
        }

        .card.matched {
             box-shadow: 0 0 15px var(--control-color), 0 4px 8px rgba(0, 0, 0, 0.3);
        }
        /* ==================================== */
        
        .card-inner {
            position: absolute;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.6s;
            transform-style: preserve-3d;
        }
        
        .card-inner.flipped {
            transform: rotateY(180deg);
        }

        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
        }

        .card-front {
            background-color: #1a237e;
            color: white;
            font-size: 1.5rem;
        }

        .card-back {
            background-color: white;
            color: #1a237e;
            font-size: 1.5rem;
            transform: rotateY(180deg);
        }
        
        .card.matched .card-back {
            background-color: var(--match-color);
            color: white;
            cursor: default;
        }

        .controls {
            margin-top: 15px;
            display: flex;
            justify-content: center; 
            gap: 15px; 
        }
        
        .controls button {
            color: #1a237e; /* Color de texto más oscuro para contrastar con el amarillo */
            border: none;
            padding: 12px 25px;
            font-size: 1rem;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
            font-weight: bold;
            margin: 0; 
            background-color: var(--control-color); /* Color unificado */
        }
        
        /* === ESTILOS DINÁMICOS DEL BOTÓN COMODÍN (MEJORADO) === */
        .controls button#wildcard-btn {
            min-width: 160px;
        }
        
        .controls button#wildcard-btn.active {
            background-color: var(--wildcard-color); /* Naranja/Esperando */
            box-shadow: 0 0 15px var(--wildcard-color);
            color: white;
        }
        
        .controls button:hover:not(:disabled) {
            background-color: #ffc107; /* Tonalidad diferente de amarillo */
            transform: translateY(-2px);
        }
        
        .controls button:disabled {
            background-color: #9c27b0; 
            cursor: not-allowed;
            opacity: 0.7;
            color: white;
        }
        /* ==================================== */


        /* === ESTILOS DE CONTROL DE AUDIO === */
        .audio-control {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 200;
        }

        .audio-control button {
            background-color: rgba(0, 0, 0, 0.3); 
            color: white;
            border: none;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            font-size: 1.5rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
            transition: background-color 0.2s;
            padding: 0;
        }

        .audio-control button:hover {
            background-color: rgba(0, 0, 0, 0.5);
        }
        /* ==================================== */

        /* === ESTILOS DE EFECTO DE NIVEL === */
        .brain-icon {
            font-size: 6rem;
            animation: brain-float 1.5s infinite alternate ease-in-out, 
                       brain-scale 0.5s ease-out;
            color: var(--control-color);
            text-shadow: 0 0 15px rgba(255, 235, 59, 0.8);
        }

        @keyframes brain-float {
            from { transform: translateY(0); }
            to { transform: translateY(-15px); }
        }
        
        @keyframes brain-scale {
            0% { transform: scale(0); }
            100% { transform: scale(1); }
        }
        
        .level-up {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            text-align: center;
        }
        
        .level-up h2 {
            font-size: 3rem;
            margin-bottom: 10px;
            color: var(--control-color);
            text-shadow: 2px 2px 5px rgba(0,0,0,0.5);
        }
        
        .level-up p {
            font-size: 1.5rem;
            margin-bottom: 10px;
        }
        
        /* Responsive adjustments */
        @media (max-width: 480px) {
            .card {
                height: 60px;
                font-size: 1rem;
            }
            .stats {
                padding: 8px;
            }
            .stat-label {
                font-size: 0.7rem;
            }
            .stat-value {
                font-size: 1.2rem;
            }
            .audio-control button {
                width: 40px;
                height: 40px;
                font-size: 1.3rem;
            }
            
            /* AJUSTE PARA MANTENER LOS CONTROLES HORIZONTALES */
            .controls {
                flex-direction: row; /* Asegura la alineación horizontal */
                flex-wrap: wrap; 
                gap: 10px;
            }
            .controls button {
                flex-grow: 1; 
                min-width: unset; 
            }
        }
    </style>
</head>
<body>
    
    <div id="feedback-message" style="position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 300; padding: 20px 40px; border-radius: 10px; font-size: 2rem; font-weight: bold; color: white; opacity: 0; transition: opacity 0.3s, transform 0.3s; pointer-events: none; text-shadow: 2px 2px 5px rgba(0,0,0,0.5);"></div>

    <audio id="audioFondo" src="fondo.mp3" loop></audio> 
    <audio id="audioClick" src="primero.mp3"></audio> 
    <audio id="audioLevelUp" src="nivel.mp3"></audio> <div class="audio-control">
        <button id="toggle-music-btn">🔊 </button>
    </div>

    <div class="container">
        <h2>Memory Game</h2>
        
        <div class="stats">
            <div class="stat-box">
                <div class="stat-label">Nivel</div>
                <div class="stat-value" id="level">1</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Puntuación</div>
                <div class="stat-value" id="score">0</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Intentos</div>
                <div class="stat-value" id="attempts">0</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Comodines</div>
                <div class="stat-value" id="wildcards">0</div>
            </div>
            </div>
        
        <div class="progress-bar-container">
            <div id="level-progress" class="progress-bar"></div>
        </div>
        
        <div class="game-board" id="game-board">
             </div>

        <div class="controls">
            <button id="wildcard-btn" onclick="useWildcard()">🏅 Usar Comodín</button> 
            <button onclick="window.location.href='canje.html'">🏆 Canjear Premios</button>
        </div>
    </div>

  <div style="margin-top: 30px; font-size: 0.9rem;">
    <a href="privacidad.html" style="color: var(--control-color); text-decoration: none;">Políticas de Privacidad</a>
</div>

    
    <script>
        // ====================================================================
        // === CONFIGURACIÓN Y VARIABLES ===
        // ====================================================================
        
        const gameBoard = document.getElementById('game-board');
        const levelDisplay = document.getElementById('level');
        const scoreDisplay = document.getElementById('score');
        const scoreValueElement = document.getElementById('score').closest('.stat-value');
        const attemptsDisplay = document.getElementById('attempts');
        const wildcardDisplay = document.getElementById('wildcards'); 
        const wildcardBtn = document.getElementById('wildcard-btn'); 
        const feedbackMessage = document.getElementById('feedback-message'); 
        const progressBar = document.getElementById('level-progress');
        
        // AUDIO ELEMENTS
        const audioFondo = document.getElementById('audioFondo');
        const audioClick = document.getElementById('audioClick');
        const audioLevelUp = document.getElementById('audioLevelUp'); // NUEVO: Audio de subida de nivel
        const toggleMusicBtn = document.getElementById('toggle-music-btn');
        let isMusicPlaying = false; 
        
        const MAX_PAIRS = 28; 
        
        let level = 1;
        let score = 0;
        let attempts = 0;
        let wildcards = 0; 
        let flippedCards = [];
        let matchedPairs = 0;
        let totalPairsInLevel = 5; 
        let canFlip = true;
        let wildcardActive = false; 
        let matchedCardIndices = []; 

        const allSymbols = [
            '🦊', '🐱', '🐺', '🦄', '🐰', '🐶', '🐻', '🐼', '🐨', '🐯', 
            '🦁', '🐮', '🐷', '🐸', '🐵', '🐔', '🐧', '🦅', '🦉', '🦆', 
            '🦋', '🐛', '🐝', '🐞', '🐠', '🐳', '🐬', '🐢', '🐍', '🐊', 
            '🇦🇷', '🇧🇷', '🇨🇱', '🇨🇴', '🇪🇸', '🇫🇷', '🇬🇧', '🇮🇹', '🇯🇵', '🇲🇽', 
            '🇺🇸', '🇨🇦', '🇩🇪', '🇨🇳', '🇮🇳', '🇵🇪', '🇵🇹', '🇷🇺', '🇰🇷', '🇿🇦', 
            '🚗', '🚕', '🚌', '🏎️', '🚓', '🚑', '🚒', '🚚', '🚜', '🛵', 
            '🚲', '🚢', '✈️', '🚀', '🚁', '🚂', '🚄', '🚆', '🚇', '🚃' 
            
        ];


        // ====================================================================
        // === FUNCIONES DE AUDIO Y EFECTOS ===
        // ====================================================================
        
        function playSoundClick() {
            audioClick.pause();
            audioClick.currentTime = 0;
            audioClick.play().catch(e => console.warn("Error al reproducir el sonido de click:", e));
        }

        function playSoundLevelUp() {
            audioLevelUp.pause();
            audioLevelUp.currentTime = 0;
            audioLevelUp.volume = 0.8; 
            audioLevelUp.play().catch(e => console.warn("Error al reproducir el sonido de nivel:", e));
        }

        function toggleBackgroundMusic() {
            if (isMusicPlaying) {
                audioFondo.pause();
                toggleMusicBtn.textContent = '🔈'; 
            } else {
                audioFondo.volume = 0.4; 
                audioFondo.play().catch(e => console.warn("Error al iniciar la música de fondo:", e));
                toggleMusicBtn.textContent = '🔊'; 
            }
            isMusicPlaying = !isMusicPlaying; 
            localStorage.setItem('memoryGameMusicState', isMusicPlaying); 
        }

        function animateScoreGain() {
            scoreValueElement.classList.add('score-boost');
            setTimeout(() => {
                scoreValueElement.classList.remove('score-boost');
            }, 400); 
        }

        function showFeedback(message, type) {
            feedbackMessage.textContent = message;
            
            if (type === 'match') {
                feedbackMessage.style.backgroundColor = 'rgba(76, 175, 80, 0.8)';
            } else if (type === 'fail') {
                feedbackMessage.style.backgroundColor = 'rgba(244, 67, 54, 0.8)'; 
            }
            
            feedbackMessage.style.opacity = '1';
            feedbackMessage.style.transform = 'translate(-50%, -50%) scale(1.1)';

            setTimeout(() => {
                feedbackMessage.style.opacity = '0';
                feedbackMessage.style.transform = 'translate(-50%, -50%) scale(1)';
            }, 1000); 
        }


        // ====================================================================
        // === ALMACENAMIENTO LOCAL Y ESTADÍSTICAS ===
        // ====================================================================

        function loadGameData() {
            const savedLevel = localStorage.getItem('memoryGameLevel');
            const savedScore = localStorage.getItem('memoryGameScore');
            const savedMatchedIndices = localStorage.getItem('memoryMatchedIndices');
            const savedMusicState = localStorage.getItem('memoryGameMusicState'); 
            const savedAttempts = localStorage.getItem('memoryGameAttempts'); 
            const savedWildcards = localStorage.getItem('memoryGameWildcards'); 
            
            if (savedLevel !== null) {
                level = parseInt(savedLevel);
            }
            if (savedScore !== null) {
                score = parseInt(savedScore);
            }
            if (savedAttempts !== null) { 
                attempts = parseInt(savedAttempts);
            }
            if (savedWildcards !== null) { 
                wildcards = parseInt(savedWildcards);
            }
            if (savedMatchedIndices !== null) {
                matchedCardIndices = JSON.parse(savedMatchedIndices);
            } else {
                matchedCardIndices = [];
            }
            
            updateStatsDisplays();

            // Restaura el estado de la musica
            if (savedMusicState === 'true') {
                isMusicPlaying = true;
                audioFondo.volume = 0.4;
                toggleMusicBtn.textContent = '🔊';
            } else {
                isMusicPlaying = false;
                audioFondo.pause();
                toggleMusicBtn.textContent = '🔈';
            }
        }

        function saveGameData() {
            localStorage.setItem('memoryGameLevel', level);
            localStorage.setItem('memoryGameScore', score);
            localStorage.setItem('memoryMatchedIndices', JSON.stringify(matchedCardIndices));
            localStorage.setItem('memoryGameMusicState', isMusicPlaying); 
            localStorage.setItem('memoryGameAttempts', attempts); 
            localStorage.setItem('memoryGameWildcards', wildcards); 
        }
        
        /**
         * Actualiza todos los displays de estadísticas (Puntuación, Intentos, Comodines)
         * y la barra de progreso.
         */
        function updateStatsDisplays() {
            levelDisplay.textContent = level;
            scoreDisplay.textContent = score;
            attemptsDisplay.textContent = attempts;
            wildcardDisplay.textContent = wildcards;
            
            // --- LÓGICA DE BARRA DE PROGRESO ---
            if (progressBar && totalPairsInLevel > 0) {
                const percentage = (matchedPairs / totalPairsInLevel) * 100;
                progressBar.style.width = `${percentage}%`;
            } else if (progressBar) {
                progressBar.style.width = '0%';
            }
            
            updateComodinButtonAppearance();
        }
        
        /**
         * Actualiza el ícono y estado del botón de comodín.
         */
        function updateComodinButtonAppearance() {
            wildcardBtn.classList.remove('active');
            
            if (wildcardActive) {
                wildcardBtn.disabled = true;
                wildcardBtn.classList.add('active');
                wildcardBtn.textContent = '⏳ Comodín Activo'; 
            } else if (wildcards > 0) {
                wildcardBtn.disabled = false;
                wildcardBtn.textContent = '🧡 Usar Comodín'; 
            } else {
                wildcardBtn.disabled = true;
                wildcardBtn.textContent = '🚫 Sin Comodines'; 
            }
        }

        // ====================================================================
        // === LOGICA DEL JUEGO ===
        // ====================================================================
        
        /**
         * Maneja la actualización de la puntuación, asegurando que el display
         * y el almacenamiento se mantengan sincronizados, y activa la animación.
         * @param {number} points - Puntos a añadir (puede ser positivo o negativo).
         */
        function updateScore(points) {
            score += points;
            animateScoreGain();
            saveGameData();
        }

        function clearGameBoardCards() {
            const cards = gameBoard.querySelectorAll('.card');
            cards.forEach(card => card.remove());
        }

        function initGame() {
            clearGameBoardCards(); 

            flippedCards = [];
            
            const pairsCount = Math.min(5 + (level - 1), MAX_PAIRS); 
            totalPairsInLevel = pairsCount; 
            
            // Recalcula matchedPairs basado en los datos guardados, si existen.
            matchedPairs = matchedCardIndices.length / 2;
            const totalCards = pairsCount * 2;
            
            updateStatsDisplays(); 

            if (matchedPairs === pairsCount) {
                // Si ya estaba completado al cargar, subir de nivel sin pantalla.
                levelUp(false); 
                return;
            }

            // Lógica para reiniciar intentos y layout si el nivel o el layout guardado es diferente.
            let currentLayout = JSON.parse(localStorage.getItem('memoryCardLayout'));
            
            if (currentLayout === null || currentLayout.length !== totalCards) {
                 attempts = 0; // Reinicia intentos para un nuevo layout/nivel
                 
                 // --- Lógica de Selección de Símbolos ---
                 let levelSymbols;
                 const currentMaxPairs = Math.min(5 + (level - 1), MAX_PAIRS);

                 if (currentMaxPairs === MAX_PAIRS) {
                      const shuffledAllSymbols = shuffleArray([...allSymbols]);
                      levelSymbols = shuffledAllSymbols.slice(0, MAX_PAIRS); 
                 } else {
                     levelSymbols = allSymbols.slice(0, currentMaxPairs); 
                 }

                 const cardValues = [...levelSymbols, ...levelSymbols];
                 const shuffledCards = shuffleArray(cardValues);
                 currentLayout = shuffledCards;
                 
                 localStorage.setItem('memoryCardLayout', JSON.stringify(currentLayout));
                 matchedCardIndices = [];
                 saveGameData();
            }

            attemptsDisplay.textContent = attempts;

            const columns = Math.min(Math.ceil(Math.sqrt(totalCards)), 8);
            gameBoard.style.gridTemplateColumns = `repeat(${columns}, 1fr)`;
            
            // Renderiza las cartas
            currentLayout.forEach((symbol, index) => {
                const card = document.createElement('div');
                card.classList.add('card');
                card.dataset.symbol = symbol;
                card.dataset.index = index; 
                
                const isMatched = matchedCardIndices.includes(index);

                card.innerHTML = `
                    <div class="card-inner ${isMatched ? 'flipped' : ''}">
                        <div class="card-front">?</div>
                        <div class="card-back">${symbol}</div>
                    </div>
                `;
                
                if (isMatched) {
                    card.classList.add('matched');
                } else {
                    card.addEventListener('click', () => flipCard(card));
                }
                
                gameBoard.appendChild(card);
            });
            
            updateComodinButtonAppearance();
        }
        
        function flipCard(card) {
            const cardInner = card.querySelector('.card-inner');

            if (!canFlip || cardInner.classList.contains('flipped') || card.classList.contains('matched')) {
                return;
            }
            
            playSoundClick();

            cardInner.classList.add('flipped');
            flippedCards.push(card);
            
            if (flippedCards.length === 2) {
                canFlip = false;
                attempts++;
                
                updateStatsDisplays(); 
                saveGameData(); 

                const [cardA, cardB] = flippedCards;

                if (cardA.dataset.symbol === cardB.dataset.symbol) {
                    // Coinciden (Pareja)
                    setTimeout(() => {
                        
                        showFeedback("¡Pareja!", 'match'); 
                        
                        // Añadir estilos de emparejamiento
                        cardA.classList.add('matched');
                        cardB.classList.add('matched');
                        
                        // Registrar índices de emparejamiento
                        matchedCardIndices.push(parseInt(cardA.dataset.index));
                        matchedCardIndices.push(parseInt(cardB.dataset.index));
                        
                        matchedPairs++;
                        
                        updateScore(1); // Usando la función auxiliar
                        
                        // Deshabilitar click
                        cardA.removeEventListener('click', flipCard);
                        cardB.removeEventListener('click', flipCard);
                        
                        updateStatsDisplays(); 
                        
                        if (matchedPairs === totalPairsInLevel) {
                            setTimeout(levelUp, 800);
                        }
                        
                        flippedCards = [];
                        canFlip = true;
                    }, 500);
                } else {
                    // No coinciden - voltear de nuevo
                    setTimeout(() => {
                        
                        showFeedback("¡No!", 'fail'); 
                        
                        cardA.querySelector('.card-inner').classList.remove('flipped');
                        cardB.querySelector('.card-inner').classList.remove('flipped');
                        
                        flippedCards = [];
                        canFlip = true;
                        updateComodinButtonAppearance();
                    }, 1000);
                }
            }
        }
        
        /**
         * Activa un comodín para revelar y emparejar dos cartas no coincidentes.
         */
        function useWildcard() {
            if (wildcards <= 0 || !canFlip || wildcardActive) {
                return;
            }

            canFlip = false;
            wildcardActive = true; 
            updateComodinButtonAppearance(); 

            showFeedback("¡Comodín Activo!", 'match');

            // 1. Encontrar dos cartas no emparejadas con el mismo simbolo
            const allUnmatchedCards = Array.from(gameBoard.querySelectorAll('.card:not(.matched)'));
            
            if (allUnmatchedCards.length < 2) {
                // No hay suficientes cartas para usar el comodín.
                console.warn("No quedan suficientes cartas para usar el comodín.");
                canFlip = true;
                wildcardActive = false;
                updateComodinButtonAppearance();
                return;
            }

            // Selecciona el primer par que encuentre
            let card1 = null;
            let card2 = null;

            for(let i = 0; i < allUnmatchedCards.length; i++){
                const currentSymbol = allUnmatchedCards[i].dataset.symbol;
                card2 = allUnmatchedCards.slice(i + 1).find(c => c.dataset.symbol === currentSymbol);
                if(card2){
                    card1 = allUnmatchedCards[i];
                    break;
                }
            }
            
            if (!card1 || !card2) {
                 // Esto no debería pasar si allUnmatchedCards.length >= 2, pero como seguridad.
                 canFlip = true;
                 wildcardActive = false;
                 updateComodinButtonAppearance();
                 return;
            }

            // 2. Simular el volteo y emparejamiento con animación 
            card1.querySelector('.card-inner').classList.add('flipped');
            card2.querySelector('.card-inner').classList.add('flipped');

            setTimeout(() => {
                // Marcar como emparejadas
                card1.classList.add('matched');
                card2.classList.add('matched');

                // Eliminar el event listener (ya que están emparejadas)
                card1.removeEventListener('click', flipCard);
                card2.removeEventListener('click', flipCard);
                
                // Actualizar datos del juego
                matchedCardIndices.push(parseInt(card1.dataset.index));
                matchedCardIndices.push(parseInt(card2.dataset.index));

                matchedPairs++;
                
                updateScore(2); // Puntuación extra por comodín
                wildcards--;
                saveGameData(); // Guardar el nuevo número de comodines
                
                // Finalizar el uso del comodín
                wildcardActive = false; 

                // Revisar si se terminana el nivel
                if (matchedPairs === totalPairsInLevel) {
                    setTimeout(levelUp, 800);
                } else {
                    canFlip = true; 
                    updateStatsDisplays(); // Actualiza comodines y progreso
                }
            }, 1200);
        }

        
        function levelUp(showScreen = true) {
            
            playSoundLevelUp(); // REPRODUCE el audio de subida de nivel
            
            const oldLevel = level;
            
            // Seguimiento GA4
            if (typeof gtag === 'function') {
                gtag('event', 'level_up', {
                    'level': oldLevel,
                    'score_at_level_end': score,
                    'attempts_to_complete': attempts,
                    'event_category': 'game_progression'
                });
            }

            canFlip = false; 
            
            level++;
            
            // Recompensa de Comodin
            wildcards++; 

            matchedCardIndices = [];
            localStorage.removeItem('memoryCardLayout'); 
            
            saveGameData(); 

            if (!showScreen) {
                 canFlip = true; 
                 initGame();
                 return;
            }
            
            // PANTALLA DE LEVEL UP MEJORADA
            const levelUpScreen = document.createElement('div');
            levelUpScreen.classList.add('level-up');
            
            let levelMessage;
            const nextPairsCount = Math.min(5 + (level - 1), MAX_PAIRS);
            
            if (nextPairsCount === MAX_PAIRS) {
                levelMessage = `¡Máxima Dificultad! (${MAX_PAIRS * 2} cartas)`;
            } else {
                levelMessage = `Preparando Nivel ${level} (${nextPairsCount} pares)...`;
            }
            
            levelUpScreen.innerHTML = `
                <span class="brain-icon" style="margin-bottom: 20px;">🧠</span>
                
                <h2>¡Nivel ${oldLevel} Completado!</h2>
                <p>Puntuación actual: **${score}**</p>
                <p>¡Has ganado 1 Comodín! Tienes **${wildcards}**.</p>
                <p style="font-size: 1.8rem; font-weight: bold; color: var(--control-color); margin-top: 20px;">
                    ${levelMessage}
                </p>
            `;
            
            document.body.appendChild(levelUpScreen);
            
            setTimeout(() => {
                if(document.body.contains(levelUpScreen)){
                    document.body.removeChild(levelUpScreen);
                }
                canFlip = true;
                initGame();
            }, 2500);
        }
        
        // Mezclar array (Fisher-Yates)
        function shuffleArray(array) {
            const newArray = [...array];
            for (let i = newArray.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
            }
            return newArray;
        }
        
        // ====================================================================
        // === INICIO DEL JUEGO Y EVENT LISTENERS ===
        // ====================================================================

        toggleMusicBtn.addEventListener('click', toggleBackgroundMusic);

        // Proceso de inicio
        window.addEventListener('load', () => {
            loadGameData(); 
            initGame();
            
            if (isMusicPlaying) {
                 audioFondo.play().catch(e => console.warn("Autoplay bloqueado. El usuario debe interactuar para que inicie la música.", e));
            }
        });
        
        // Evento para guardar el estado de la música al salir
        window.addEventListener('beforeunload', () => {
            if (isMusicPlaying) {
                audioFondo.pause();
                audioFondo.currentTime = 0; 
            }
            localStorage.setItem('memoryGameMusicState', isMusicPlaying);
        });
    </script>
