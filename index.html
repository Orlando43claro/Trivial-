<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ascenso Mental</title>
    
    <script async src="https://www.googletagmanager.com/gtag/js?id=TU_ID_DE_MEDICION"></script>
    <script>
      window.dataLayer = window.dataLayer || [];

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'arial', sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            color: white;
            position: relative;
        }
        
        .container {
            max-width: 900px;
            width: 100%;
            text-align: center;
        }
        
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }
        
        .stats {
            display: flex;
            justify-content: space-around;
            background-color: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            padding: 10px;
            margin: 20px 0;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            position: relative;
        }
        
        .stat-box {
            display: flex;
            flex-direction: column;
        }
        
        .stat-label {
            font-size: 0.8rem;
            margin-bottom: 3px;
        }
        
        .stat-value {
            font-size: 1.4rem;
            font-weight: bold;
            transition: transform 0.2s;
        }
        
        /* === ESTILOS DE ANIMACI0ˆ7N DE PUNTOS === */
        .score-boost {
            animation: score-jump 0.4s ease-out;
        }
        
        @keyframes score-jump {
            0% { transform: scale(1); }
            50% { transform: scale(1.3) translateY(-5px); }
            100% { transform: scale(1); }
        }
        /* ==================================== */

        .game-board {
            display: grid;
            gap: 10px;
            margin: 20px auto;
            max-width: 900px;
            padding: 10px;
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            position: relative;
        }
        
        .card {
            height: 80px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            cursor: pointer;
            transition: transform 0.3s;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            color: white;
            font-weight: bold;
            backface-visibility: hidden;
            transform-style: preserve-3d;
            position: relative;
        }
        
        .card-inner {
            position: absolute;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.6s;
            transform-style: preserve-3d;
        }
        
        .card-inner.flipped {
            transform: rotateY(180deg);
        }

        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
        }

        .card-front {
            background-color: #1a237e;
            color: white;
            font-size: 1.5rem;
        }

        .card-back {
            background-color: white;
            color: #1a237e;
            font-size: 1.5rem;
            transform: rotateY(180deg);
        }
        
        .card.matched .card-back {
            background-color: #4caf50;
            color: white;
            cursor: default;
        }

        .controls {
            margin-top: 15px;
            /* CAMBIO: Usar Flexbox para alinear botones horizontalmente */
            display: flex;
            justify-content: center; 
            gap: 15px; 
        }
        
        .controls button {
            background-color: #ff4081;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 1rem;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            font-weight: bold;
            margin: 0; /* Aseguramos que el margin horizontal se controle por 'gap' */
        }
        
        .controls button:hover:not(:disabled) {
            background-color: #f50057;
            transform: translateY(-2px);
        }
        
        .controls button:disabled {
            background-color: #9c27b0; 
            cursor: not-allowed;
            opacity: 0.7;
        }

        /* === ESTILOS DE CONTROL DE AUDIO === */
        .audio-control {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 200;
        }

        .audio-control button {
            background-color: rgba(0, 0, 0, 0.3);
            color: white;
            border: none;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            font-size: 1.5rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
            transition: background-color 0.2s;
        }

        .audio-control button:hover {
            background-color: rgba(0, 0, 0, 0.5);
        }
        /* ==================================== */

        /* === ESTILOS DE EFECTO DE NIVEL === */
        /* El overlay original se mantiene para otros efectos, pero su funcionalidad de LEVEL-UP se mueve al .level-up */
        .level-effect-overlay {
            display: none; /* Ocultamos el overlay original, ya no se usa para LevelUp */
        }
        
        /* ESTILOS CLAVE PARA EL ICONO DEL CEREBRO ANIMADO */
        .brain-icon {
            font-size: 6rem;
            animation: brain-float 1.5s infinite alternate ease-in-out, 
                       brain-scale 0.5s ease-out;
            color: #ffeb3b;
            text-shadow: 0 0 15px rgba(255, 235, 59, 0.8);
        }

        @keyframes brain-float {
            from { transform: translateY(0); }
            to { transform: translateY(-15px); }
        }
        
        @keyframes brain-scale {
            0% { transform: scale(0); }
            100% { transform: scale(1); }
        }
        /* ==================================== */

        .level-up {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9); /* Un poco m¨¢s oscuro */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            text-align: center;
        }
        
        .level-up h2 {
            font-size: 3rem;
            margin-bottom: 10px;
            color: #ffeb3b;
            text-shadow: 2px 2px 5px rgba(0,0,0,0.5);
        }
        
        .level-up p {
            font-size: 1.5rem;
            margin-bottom: 10px;
        }
        
        /* Responsive adjustments */
        @media (max-width: 480px) {
            .card {
                height: 60px;
                font-size: 1rem;
            }
            .stats {
                padding: 8px;
            }
            .stat-label {
                font-size: 0.7rem;
            }
            .stat-value {
                font-size: 1.2rem;
            }
            .audio-control button {
                width: 40px;
                height: 40px;
                font-size: 1.3rem;
            }
            .controls {
                flex-direction: column;
                gap: 10px;
            }
        }
    </style>
</head>
<body>
    
    <div id="feedback-message" style="position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 300; padding: 20px 40px; border-radius: 10px; font-size: 2rem; font-weight: bold; color: white; opacity: 0; transition: opacity 0.3s, transform 0.3s; pointer-events: none; text-shadow: 2px 2px 5px rgba(0,0,0,0.5);"></div>

    <audio id="audioFondo" src="fondo.mp3" loop></audio> 
    <audio id="audioClick" src="primero.mp3"></audio> 
    <div class="audio-control">
        <button id="toggle-music-btn">🔊</button>
    </div>

    <div class="container">
        <h2>🧠 Ascenso Mental 🧠</h2>
        
        <div class="stats">
            <div class="stat-box">
                <div class="stat-label">Nivel</div>
                <div class="stat-value" id="level">1</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Puntuación</div>
                <div class="stat-value" id="score">0</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Intentos</div>

        <div class="game-board" id="game-board">
             <div class="level-effect-overlay" id="level-overlay">
                <span class="brain-icon">🧠</span>

        <div class="controls">
            <button id="wildcard-btn" onclick="useWildcard()">✨ Usar Comodín</button>

  <div style="margin-top: 30px; font-size: 0.9rem;">
    <a href="privacidad.html" style="color: #ffeb3b; text-decoration: none;">Políticas de Privacidad</a>
</div>

    
    <script>
        // ====================================================================
        // === CONFIGURACI0ˆ7N Y VARIABLES ===
        // ====================================================================
        
        const gameBoard = document.getElementById('game-board');
        const levelDisplay = document.getElementById('level');
        const scoreDisplay = document.getElementById('score');
        const scoreValueElement = document.getElementById('score').closest('.stat-value');
        const attemptsDisplay = document.getElementById('attempts');
        const levelOverlay = document.getElementById('level-overlay'); // Se mantiene pero est¨¢ oculto en CSS
        const wildcardDisplay = document.getElementById('wildcards'); 
        const wildcardBtn = document.getElementById('wildcard-btn'); 
        const feedbackMessage = document.getElementById('feedback-message'); 
        
        // AUDIO ELEMENTS
        const audioFondo = document.getElementById('audioFondo');
        const audioClick = document.getElementById('audioClick');
        const toggleMusicBtn = document.getElementById('toggle-music-btn');
        let isMusicPlaying = false; 
        
        const MAX_PAIRS = 28; 
        
        let level = 1;
        let score = 0;
        let attempts = 0;
        let wildcards = 0; 
        let flippedCards = [];
        let matchedPairs = 0;
        let canFlip = true;
        let matchedCardIndices = []; 

        const allSymbols = [
            '”9Î8', '”9Î3', '”9Í9', '”9Ï1', '”9Î2', '•0Ù2', '”9Ï3', '”9Ï4', '”9Í4', '”9Î1', 
            '•0Ø3', '”9Î0', '”9Î9', '”9Ï0', '”9Î7', '”9Ë4', '”9Í3', '•0Ø7', '•0Ù1', '•0Ø8', 
            '•0Ù3', '”9Ì1', '”9Ì3', '”9Ì4', '”9Ì6', '”9Î5', '”9Í8', '”9Ì8', '”9Ê7', '”9Ê4', 
            '”9“6”9•3', '”9“7”9•3', '”9“8”9”7', '”9“8”9•0', '”9”0”9•4', '”9”1”9•3', '”9”2”9“7', '”9”4”9•5', '”9”5”9•1', '”9”8”9•9', 
            '”9•6”9•4', '”9“8”9“6', '”9“9”9”0', '”9“8”9”9', '”9”4”9”9', '”9•1”9”0', '”9•1”9•5', '”9•3”9•6', '”9”6”9•3', '”9–1”9“6', 
            '•07', '•05', '•0Œ6', '”9Ä4„1‚5', '•03', '•01', '•02', '•0Ž0', '•0Ž2', '•0—1', 
            '•04', '•0Ž8', '7¼6„1‚5', '•0‹4', '•0‹5', '•0‹6', '•0‹8', '•0Œ0', '•0Œ1', '•0‹7' 
        ];


        // ====================================================================
        // === FUNCIONES DE AUDIO Y EFECTOS ===
        // ====================================================================
        
        /**
         * Reproduce el sonido de click de carta.
         */
        function playSoundClick() {
            audioClick.pause();
            audioClick.currentTime = 0;
            audioClick.play().catch(e => console.warn("Error al reproducir el sonido de click:", e));
        }

        /**
         * Alterna la reproducci¨®n de la m¨²sica de fondo y actualiza el ¨ªcono del bot¨®n.
         */
        function toggleBackgroundMusic() {
            if (isMusicPlaying) {
                audioFondo.pause();
                toggleMusicBtn.textContent = '”9ã7'; 
            } else {
                audioFondo.volume = 0.4; 
                audioFondo.play().catch(e => console.warn("Error al iniciar la m¨²sica de fondo:", e));
                toggleMusicBtn.textContent = '”9ä0'; 
            }
            isMusicPlaying = !isMusicPlaying; 
            localStorage.setItem('memoryGameMusicState', isMusicPlaying); 
        }

        /**
         * Aplica un efecto de "moneda" a la puntuaci¨®n al ganar un punto.
         */
        function animateScoreGain() {
            scoreValueElement.classList.add('score-boost');
            setTimeout(() => {
                scoreValueElement.classList.remove('score-boost');
            }, 400); 
        }

        /**
         * Muestra un mensaje temporal de feedback.
         */
        function showFeedback(message, type) {
            feedbackMessage.textContent = message;
            
            if (type === 'match') {
                feedbackMessage.style.backgroundColor = 'rgba(76, 175, 80, 0.8)'; // Verde
            } else if (type === 'fail') {
                feedbackMessage.style.backgroundColor = 'rgba(244, 67, 54, 0.8)'; // Rojo
            }
            
            feedbackMessage.style.opacity = '1';
            feedbackMessage.style.transform = 'translate(-50%, -50%) scale(1.1)';

            setTimeout(() => {
                feedbackMessage.style.opacity = '0';
                feedbackMessage.style.transform = 'translate(-50%, -50%) scale(1)';
            }, 1000); 
        }


        // ====================================================================
        // === ALMACENAMIENTO LOCAL ===
        // ====================================================================

        function loadGameData() {
            const savedLevel = localStorage.getItem('memoryGameLevel');
            const savedScore = localStorage.getItem('memoryGameScore');
            const savedMatchedIndices = localStorage.getItem('memoryMatchedIndices');
            const savedMusicState = localStorage.getItem('memoryGameMusicState'); 
            const savedAttempts = localStorage.getItem('memoryGameAttempts'); 
            const savedWildcards = localStorage.getItem('memoryGameWildcards'); 
            
            if (savedLevel !== null) {
                level = parseInt(savedLevel);
                levelDisplay.textContent = level;
            }
            if (savedScore !== null) {
                score = parseInt(savedScore);
                scoreDisplay.textContent = score;
            }
            if (savedAttempts !== null) { 
                attempts = parseInt(savedAttempts);
                attemptsDisplay.textContent = attempts;
            }
            if (savedWildcards !== null) { 
                wildcards = parseInt(savedWildcards);
                wildcardDisplay.textContent = wildcards;
            }
            if (savedMatchedIndices !== null) {
                matchedCardIndices = JSON.parse(savedMatchedIndices);
            } else {
                matchedCardIndices = [];
            }

            // Restaura el estado de la musica
            if (savedMusicState === 'true') {
                isMusicPlaying = true;
                audioFondo.volume = 0.4;
                toggleMusicBtn.textContent = '”9ä0';
            } else {
                isMusicPlaying = false;
                audioFondo.pause();
                toggleMusicBtn.textContent = '”9ã7';
            }
        }

        function saveGameData() {
            localStorage.setItem('memoryGameLevel', level);
            localStorage.setItem('memoryGameScore', score);
            localStorage.setItem('memoryMatchedIndices', JSON.stringify(matchedCardIndices));
            localStorage.setItem('memoryGameMusicState', isMusicPlaying); 
            localStorage.setItem('memoryGameAttempts', attempts); 
            localStorage.setItem('memoryGameWildcards', wildcards); 
        }

        // ====================================================================
        // === LOGICA DEL JUEGO ===
        // ====================================================================

        function clearGameBoardCards() {
            const cards = gameBoard.querySelectorAll('.card');
            cards.forEach(card => card.remove());
        }

        function initGame() {
            clearGameBoardCards(); 

            flippedCards = [];
            
            const pairsCount = Math.min(5 + (level - 1), MAX_PAIRS); 
            
            matchedPairs = matchedCardIndices.length / 2;
            const totalCards = pairsCount * 2;
            
            if (matchedPairs === pairsCount) {
                levelUp(false);
                return;
            }

            // Si se carga un nuevo layout, se reinician los intentos
            if (localStorage.getItem('memoryCardLayout') === null || JSON.parse(localStorage.getItem('memoryCardLayout')).length !== totalCards) {
                 attempts = 0;
            }
            
            attemptsDisplay.textContent = attempts;
            
            // --- Logica de Selección de Símbolos ---
            let levelSymbols;
            const currentMaxPairs = Math.min(5 + (level - 1), MAX_PAIRS);

            if (currentMaxPairs === MAX_PAIRS) {
                 const shuffledAllSymbols = shuffleArray([...allSymbols]);
                 levelSymbols = shuffledAllSymbols.slice(0, MAX_PAIRS); 
            } else {
                levelSymbols = allSymbols.slice(0, currentMaxPairs); 
            }

            const cardValues = [...levelSymbols, ...levelSymbols];
            
            let currentLayout = JSON.parse(localStorage.getItem('memoryCardLayout'));
            
            if (currentLayout === null || currentLayout.length !== totalCards) {
                 const shuffledCards = shuffleArray(cardValues);
                 currentLayout = shuffledCards;
                 localStorage.setItem('memoryCardLayout', JSON.stringify(currentLayout));
                 matchedCardIndices = [];
                 saveGameData();
            }

            const columns = Math.min(Math.ceil(Math.sqrt(totalCards)), 8);
            gameBoard.style.gridTemplateColumns = `repeat(${columns}, 1fr)`;
            
            // Renderiza las cartas
            currentLayout.forEach((symbol, index) => {
                const card = document.createElement('div');
                card.classList.add('card');
                card.dataset.symbol = symbol;
                card.dataset.index = index; 
                
                const isMatched = matchedCardIndices.includes(index);

                card.innerHTML = `
                    <div class="card-inner ${isMatched ? 'flipped' : ''}">
                        <div class="card-front">?</div>
                        <div class="card-back">${symbol}</div>
                    </div>
                `;
                
                if (isMatched) {
                    card.classList.add('matched');
                    card.querySelector('.card-back').style.backgroundColor = '#4caf50';
                } else {
                    card.addEventListener('click', () => flipCard(card));
                }
                
                gameBoard.insertBefore(card, levelOverlay);
            });
            
            // Habilitar/Deshabilitar botón de comodín al inicio
            wildcardBtn.disabled = (wildcards <= 0);
        }
        
        function flipCard(card) {
            const cardInner = card.querySelector('.card-inner');

            if (!canFlip || cardInner.classList.contains('flipped') || card.classList.contains('matched')) {
                return;
            }
            
            playSoundClick();

            cardInner.classList.add('flipped');
            flippedCards.push(card);
            
            if (flippedCards.length === 2) {
                canFlip = false;
                attempts++;
                attemptsDisplay.textContent = attempts;
                saveGameData(); 

                wildcardBtn.disabled = true; 

                if (flippedCards[0].dataset.symbol === flippedCards[1].dataset.symbol) {
                    // Coinciden (Pareja)
                    setTimeout(() => {
                        
                        showFeedback("¡Pareja!", 'match'); 
                        
                        flippedCards[0].classList.add('matched');
                        flippedCards[1].classList.add('matched');
                        
                        matchedCardIndices.push(parseInt(flippedCards[0].dataset.index));
                        matchedCardIndices.push(parseInt(flippedCards[1].dataset.index));
                        
                        flippedCards[0].querySelector('.card-back').style.backgroundColor = '#4caf50';
                        flippedCards[1].querySelector('.card-back').style.backgroundColor = '#4caf50';
                        
                        matchedPairs++;
                        
                        score += 1; 
                        scoreDisplay.textContent = score;
                        animateScoreGain();
                        saveGameData();

                        flippedCards[0].removeEventListener('click', flipCard);
                        flippedCards[1].removeEventListener('click', flipCard);
                        
                        const currentPairsCount = Math.min(5 + (level - 1), MAX_PAIRS);
                        if (matchedPairs === currentPairsCount) {
                            setTimeout(levelUp, 800);
                        }
                        
                        flippedCards = [];
                        canFlip = true;
                        wildcardBtn.disabled = (wildcards <= 0); 
                    }, 500);
                } else {
                    // No coinciden - voltear de nuevo
                    setTimeout(() => {
                        
                        showFeedback("¡No!", 'fail'); 
                        
                        flippedCards[0].querySelector('.card-inner').classList.remove('flipped');
                        flippedCards[1].querySelector('.card-inner').classList.remove('flipped');
                        
                        flippedCards = [];
                        canFlip = true;
                        wildcardBtn.disabled = (wildcards <= 0); 
                    }, 1000);
                }
            }
        }
        
        /**
         * Activa un comodín para revelar y emparejar dos cartas no coincidentes.
         */
        function useWildcard() {
            if (wildcards <= 0 || !canFlip) {
                if (wildcards <= 0) {
                     alert("No tienes comodines disponibles.");
                }
                return;
            }

            canFlip = false;
            wildcardBtn.disabled = true;

            // 1. Deducir un comodín 
            wildcards--;
            wildcardDisplay.textContent = wildcards;
            saveGameData();
            
            showFeedback("0„3Comod¨ªn Activo!", 'match');

            // 2. Encontrar dos cartas no emparejadas con el mismo símbolo 
            const allUnmatchedCards = Array.from(gameBoard.querySelectorAll('.card:not(.matched)'));
            
            if (allUnmatchedCards.length < 2) {
                canFlip = true;
                wildcardBtn.disabled = (wildcards <= 0);
                return;
            }

            // Selecciona el primer par que encuentre
            let card1 = null;
            let card2 = null;

            for(let i = 0; i < allUnmatchedCards.length; i++){
                const currentSymbol = allUnmatchedCards[i].dataset.symbol;
                card2 = allUnmatchedCards.slice(i + 1).find(c => c.dataset.symbol === currentSymbol);
                if(card2){
                    card1 = allUnmatchedCards[i];
                    break;
                }
            }
            
            if (!card1 || !card2) {
                console.error("No se pudo encontrar una pareja con el comodín.");
                canFlip = true;
                wildcardBtn.disabled = (wildcards <= 0);
                return;
            }

            // 3. Simular el volteo y emparejamiento con animación 
            
            card1.querySelector('.card-inner').classList.add('flipped');
            card2.querySelector('.card-inner').classList.add('flipped');

            setTimeout(() => {
                // Marcar como emparejadas
                card1.classList.add('matched');
                card2.classList.add('matched');

                // Aplicar estilos de emparejamiento
                card1.querySelector('.card-back').style.backgroundColor = '#4caf50';
                card2.querySelector('.card-back').style.backgroundColor = '#4caf50';
                
                // Actualizar datos del juego
                matchedCardIndices.push(parseInt(card1.dataset.index));
                matchedCardIndices.push(parseInt(card2.dataset.index));

                matchedPairs++;
                
                score += 2; 
                scoreDisplay.textContent = score;
                animateScoreGain();
                saveGameData();

                // Revisar si se terminó el nivel
                const currentPairsCount = Math.min(5 + (level - 1), MAX_PAIRS);
                if (matchedPairs === currentPairsCount) {
                    setTimeout(levelUp, 800);
                } else {
                    canFlip = true; 
                    wildcardBtn.disabled = (wildcards <= 0);
                }
            }, 1200);
        }

        
        function levelUp(showScreen = true) {
            const oldLevel = level;
            
            // Seguimiento GA4
            if (typeof gtag === 'function') {
                gtag('event', 'level_up', {
                    'level': oldLevel,
                    'score_at_level_end': score,
                    'attempts_to_complete': attempts,
                    'event_category': 'game_progression'
                });
            }

            canFlip = false; 
            
            level++;
            
            // Recompensa de Comodín 
            wildcards++; 
            wildcardDisplay.textContent = wildcards;

            matchedCardIndices = [];
            localStorage.removeItem('memoryCardLayout'); 
            
            levelDisplay.textContent = level;
            saveGameData(); 

            if (!showScreen) {
                 canFlip = true; 
                 initGame();
                 return;
            }
            
            // PANTALLA DE LEVEL UP MEJORADA
            const levelUpScreen = document.createElement('div');
            levelUpScreen.classList.add('level-up');
            
            let levelMessage;
            const currentPairsCount = Math.min(5 + (level - 1), MAX_PAIRS);
            
            if (currentPairsCount === MAX_PAIRS) {
                levelMessage = `¡Máxima Dificultad! (56 cartas)`;
            } else {
                levelMessage = `Preparando Nivel ${level} (${currentPairsCount} pares)...`;
            }
            
            levelUpScreen.innerHTML = `
                <span class="brain-icon" style="margin-bottom: 20px;">🧠</span>
                
                <h2>0„3Nivel ${oldLevel} Completado!</h2>
                <p>Puntuación actual: **${score}**</p>
                <p>¡Has ganado 1 Comodín! Tienes **${wildcards}**.</p>
                <p style="font-size: 1.8rem; font-weight: bold; color: #ffeb3b; margin-top: 20px;">
                    ${levelMessage}
                </p>
            `;
            
            document.body.appendChild(levelUpScreen);
            
            setTimeout(() => {
                if(document.body.contains(levelUpScreen)){
                    document.body.removeChild(levelUpScreen);
                }
                canFlip = true;
                initGame();
            }, 2500);
        }
        
        // Mezclar array (Fisher-Yates)
        function shuffleArray(array) {
            const newArray = [...array];
            for (let i = newArray.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
            }
            return newArray;
        }
        
        // ====================================================================
        // === INICIO DEL JUEGO Y EVENT LISTENERS ===
        // ====================================================================

        // Evento para el botón de alternancia de música 
        toggleMusicBtn.addEventListener('click', toggleBackgroundMusic);

        // Proceso de inicio
        window.addEventListener('load', () => {
            loadGameData(); 
            initGame();
            
            if (isMusicPlaying) {
                 audioFondo.play().catch(e => console.warn("Autoplay bloqueado. El usuario debe interactuar para que inicie la m¨²sica.", e));
            }
        });
        
        // Evento para guardar el estado de la música al salir
        window.addEventListener('beforeunload', () => {
            if (isMusicPlaying) {
                audioFondo.pause();
                audioFondo.currentTime = 0; 
            }
            localStorage.setItem('memoryGameMusicState', isMusicPlaying);
        });
    </script>
